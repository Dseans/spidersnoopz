<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>galing ko B) </title>
<style>
  :root {
    --void: #05050a;
    --snoopy-red: #e62429;
    --snoopy-blue: #0055ff;
    --cyan: #38f2e0;
    --gold: #ffd23f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #screen-wrap {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  canvas#game {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
      transparent 2px, transparent 3px
    );
    mix-blend-mode: multiply;
  }
  #touch-controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  .tbtn-group {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  .tbtn {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: rgba(230, 36, 41, 0.25);
    border: 2px solid var(--snoopy-red);
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 12px rgba(230, 36, 41, 0.4);
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .tbtn:active {
    background: rgba(230, 36, 41, 0.6);
  }
  .tbtn.small {
    width: 44px;
    height: 44px;
    font-size: 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.4);
  }
  #btn-jump {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(0, 85, 255, 0.35);
    border: 2px solid var(--snoopy-blue);
    color: #fff;
    font-size: 28px;
    box-shadow: 0 0 16px rgba(0, 85, 255, 0.5);
  }
  #btn-jump:active {
    background: rgba(0, 85, 255, 0.7);
  }
</style>
</head>
<body>

<div id="screen-wrap">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="scanlines"></div>
</div>

<div id="touch-controls">
  <div class="tbtn-group">
    <div class="tbtn" id="btn-left">◀</div>
    <div class="tbtn" id="btn-right">▶</div>
  </div>
  <div class="tbtn-group" style="margin-bottom: 10px;">
    <div class="tbtn small" id="btn-pause">⏸</div>
    <div class="tbtn small" id="btn-mute">🔊</div>
  </div>
  <div class="tbtn" id="btn-jump">▲</div>
</div>

<script>
(function(){
'use strict';

// Prevent zoom gestures globally on touch devices
document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});

let lastTouchEnd = 0;
document.addEventListener('touchend', function (e) {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, false);

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;


const playerImg = new Image();
playerImg.src = '5853c45aec0c270fc2f62df4.png';

const hangingImg = new Image();
hangingImg.src = 'image-removebg-preview.png';

const enemyImg = new Image();
enemyImg.src = '3534763193.webp';

const GAME_W = 480, GAME_H = 270;
const GROUND_Y = 225;
const WORLD_LEN = 2700;

const GRAVITY = 1000;
const MOVE_ACCEL = 900;
const MAX_SPEED = 140;
const FRICTION = 900;
const AIR_CONTROL = 0.85;
const JUMP_SPEED = 340;
const JUMP_CUT = 0.45;
const MAX_FALL = 420;
const COYOTE_TIME = 0.1;
const SHAKE_DURATION = 0.2;

const COLORS = {
  skyTop:'#0b0d1b', skyBottom:'#211d38',
  buildingDark:'#121324', buildingMid:'#1b1c33', buildingLight:'#282a4a',
  windowLit:'#ffea78', windowDark:'#10111f', roofEdge:'#3a3d66',
  matchaLight:'#a2e078', matchaMid:'#80c253', matchaDark:'#4d822b', matchaOutline:'#1f1c2b', boba:'#3b5722',
  snoopyRed:'#E62429',
  pole:'#666677', flagColor:'#e62429', ball:'#ffd23f',
  text:'#ffffff', textShadow:'#000000', gold:'#ffd23f', danger:'#ff4d4d', cyan:'#38f2e0'
};

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(t){ return t*t*(3-2*t); }
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

/* lvls */
const GAPS = [[380,450],[780,850],[1180,1250],[1600,1670],[2080,2160]];

const PLATFORM_TEMPLATE = [
  {x:140,y:175,w:70,h:14},
  {x:480,y:170,w:70,h:14},
  {x:610,y:145,w:60,h:14},
  {x:870,y:170,w:75,h:14},
  {x:990,y:145,w:60,h:14},
  {x:1080,y:125,w:60,h:14},
  {x:1280,y:170,w:75,h:14},
  {x:1700,y:155,w:70,h:14},
  {x:1820,y:135,w:60,h:14},
  {x:2200,y:165,w:70,h:14},
  {x:2340,y:145,w:60,h:14}
];

const ENEMY_TEMPLATE = [
  {x:220,minX:160,maxX:350,y:GROUND_Y-18,w:18,h:18,speed:35,dir:1},
  {x:490,minX:480,maxX:540,y:170-18,w:18,h:18,speed:30,dir:1},
  {x:920,minX:870,maxX:1120,y:GROUND_Y-18,w:18,h:18,speed:40,dir:-1},
  {x:1320,minX:1270,maxX:1480,y:GROUND_Y-18,w:18,h:18,speed:42,dir:1},
  {x:1750,minX:1700,maxX:1980,y:GROUND_Y-18,w:18,h:18,speed:45,dir:-1},
  {x:2220,minX:2180,maxX:2420,y:GROUND_Y-18,w:18,h:18,speed:45,dir:1}
];

const FLAG_X = 2600;

function buildGroundRects(){
  const sorted = [...GAPS].sort((a,b)=>a[0]-b[0]);
  const rects = [];
  let cursor = 0;
  for(const [gs,ge] of sorted){
    if(gs>cursor) rects.push({x:cursor,y:GROUND_Y,w:gs-cursor,h:(GAME_H-GROUND_Y)+40});
    cursor = ge;
  }
  if(cursor<WORLD_LEN) rects.push({x:cursor,y:GROUND_Y,w:WORLD_LEN-cursor,h:(GAME_H-GROUND_Y)+40});
  return rects;
}
const GROUND_RECTS = buildGroundRects();
const STATIC_SOLIDS = GROUND_RECTS.concat(PLATFORM_TEMPLATE);

function makeCoinRow(p,count,gap,yOff){
  const arr = [];
  const startX = p.x + (p.w-(count-1)*gap)/2;
  for(let i=0;i<count;i++) arr.push({x:startX+i*gap, y:p.y-yOff, taken:false});
  return arr;
}
function buildCoins(){
  let coins = [];
  for(const p of PLATFORM_TEMPLATE) coins = coins.concat(makeCoinRow(p,3,14,14));
  const extra = [
    {x:250,y:195},{x:270,y:185},{x:290,y:175},{x:310,y:185},{x:330,y:195},
    {x:2420,y:195},{x:2445,y:185},{x:2470,y:175},{x:2495,y:185},{x:2520,y:195}
  ];
  coins = coins.concat(extra.map(c=>({x:c.x,y:c.y,taken:false})));
  return coins;
}

/* state */
let player, enemies, coins, particles;
let score, coinCount, lives, timeLeft, checkpointX, camX, coyoteTimer;
let state = 'start'; 
let winChoice = null;
let muted = false;
let shakeTimer = 0, shakeMag = 0;
let elapsed = 0;
let jumpHeld = false, jumpQueued = false;
let nextLifeScore = 2000;

function freshEntities(){
  return {
    enemies: ENEMY_TEMPLATE.map(e=>({...e, alive:true, deathTimer:0})),
    coins: buildCoins()
  };
}

function resetGame(){
  const fresh = freshEntities();
  enemies = fresh.enemies;
  coins = fresh.coins;
  particles = [];
  player = { 
    x:24, y:GROUND_Y-24, w:20, h:24, 
    vx:0, vy:0, 
    onGround:false, facing:1, 
    invuln:0,
    isLedgeHanging:false, ledgePlatform:null, ledgeSide:'left',
    isClimbing:false, climbTimer:0, climbDuration:0.32,
    climbFrom:{x:0,y:0}, climbMid:{x:0,y:0}, climbTo:{x:0,y:0}
  };
  score = 0; coinCount = 0; lives = 3; timeLeft = 400; checkpointX = 24; camX = 0; coyoteTimer = 0;
  winChoice = null;
  nextLifeScore = 2000;
}
resetGame();

/* control */
const input = { left:false, right:false, up:false, down:false };

function handleStartOrRestart(){
  if(state==='start'){ state='playing'; }
  else if(state==='gameover'){ resetGame(); state='playing'; }
  else if(state==='paused'){ state='playing'; }
}
function togglePause(){
  if(state==='playing') state='paused';
  else if(state==='paused') state='playing';
}
function toggleMute(){
  muted = !muted;
  const btn = document.getElementById('btn-mute');
  if(btn) btn.textContent = muted ? '🔇' : '🔊';
}

window.addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(e.key)) e.preventDefault();
  ensureAudio();
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') input.left = true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') input.right = true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') input.up = true;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') input.down = true;

  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' '){
    if(!jumpHeld) jumpQueued = true;
    jumpHeld = true;
    if(state!=='win') handleStartOrRestart();
  }
  if(e.key==='p'||e.key==='P'||e.key==='Escape') togglePause();
  if(e.key==='m'||e.key==='M') toggleMute();
},{passive:false});

window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') input.left = false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') input.right = false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') input.up = false;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') input.down = false;

  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' '){
    jumpHeld = false;
    if(player.vy<0) player.vy *= JUMP_CUT;
  }
});

function bindTouchBtn(id,onDown,onUp){
  const el = document.getElementById(id);
  if(!el) return;
  const down = ev=>{ ev.preventDefault(); ensureAudio(); onDown && onDown(); };
  const up = ev=>{ ev.preventDefault(); onUp && onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('pointercancel', up);
}
bindTouchBtn('btn-left', ()=>input.left=true, ()=>input.left=false);
bindTouchBtn('btn-right', ()=>input.right=true, ()=>input.right=false);
bindTouchBtn('btn-jump',
  ()=>{ if(!jumpHeld) jumpQueued=true; jumpHeld=true; input.up=true; if(state!=='win') handleStartOrRestart(); },
  ()=>{ jumpHeld=false; input.up=false; if(player.vy<0) player.vy*=JUMP_CUT; }
);
bindTouchBtn('btn-pause', ()=>togglePause());
bindTouchBtn('btn-mute', ()=>toggleMute());

function handleWinClick(clickX, clickY){
  if(clickX >= 150 && clickX <= 230 && clickY >= 160 && clickY <= 192){
    winChoice = 'yes';
    SFX.coin();
    spawnParticles(GAME_W/2, 100, 25, COLORS.snoopyRed);
  } else if(clickX >= 250 && clickX <= 330 && clickY >= 160 && clickY <= 192){
    winChoice = 'no';
    SFX.hurt();
  }
}

canvas.addEventListener('pointerdown', (e)=>{
  ensureAudio();
  if(state==='win'){
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (GAME_W / rect.width);
    const clickY = (e.clientY - rect.top) * (GAME_H / rect.height);
    handleWinClick(clickX, clickY);
  } else {
    handleStartOrRestart();
  }
});

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && state==='playing') state='paused';
});

/* audio */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur,type,vol,delay){
  if(muted || !audioCtx) return;
  type = type || 'square'; vol = vol || 0.12; delay = delay || 0;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
const SFX = {
  jump: ()=>{ tone(520,0.09,'square',0.09); tone(700,0.1,'square',0.07,0.05); },
  coin: ()=>{ tone(988,0.07,'square',0.1); tone(1568,0.09,'square',0.1,0.05); },
  stomp: ()=>{ tone(180,0.09,'square',0.13); },
  hurt: ()=>{ tone(140,0.22,'sawtooth',0.14); },
  win: ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'square',0.12,i*0.13)); },
  gameover: ()=>{ [392,330,262,196].forEach((f,i)=>tone(f,0.22,'sawtooth',0.12,i*0.18)); }
};

/* fisics */
function moveAndCollide(ent,dt,solids){
  ent.x += ent.vx*dt;
  ent.x = clamp(ent.x, 0, WORLD_LEN-ent.w);
  for(const r of solids){
    if(rectsOverlap(ent,r)){
      if(ent.vx>0) ent.x = r.x-ent.w;
      else if(ent.vx<0) ent.x = r.x+r.w;
      ent.vx = 0;
    }
  }
  ent.y += ent.vy*dt;
  ent.onGround = false;
  for(const r of solids){
    if(rectsOverlap(ent,r)){
      if(ent.vy>0){ ent.y = r.y-ent.h; ent.vy=0; ent.onGround=true; }
      else if(ent.vy<0){ ent.y = r.y+r.h; ent.vy = 0; }
    }
  }
}

function checkLedgeGrab(solids){
  if(player.onGround || player.isLedgeHanging || player.vy < -80) return;

  for(const r of solids){
    const vertOK = (player.y >= r.y - 4 && player.y <= r.y + 12);
    if(!vertOK) continue;

    if((input.right || player.vx > 0) && Math.abs((player.x + player.w) - r.x) <= 6){
      player.isLedgeHanging = true;
      player.facing = 1;
      player.x = r.x - player.w + 3;
      player.y = r.y;
      player.vx = 0;
      player.vy = 0;
      player.ledgePlatform = r;
      player.ledgeSide = 'left';
      break;
    }
    if((input.left || player.vx < 0) && Math.abs(player.x - (r.x + r.w)) <= 6){
      player.isLedgeHanging = true;
      player.facing = -1;
      player.x = r.x + r.w - 3;
      player.y = r.y;
      player.vx = 0;
      player.vy = 0;
      player.ledgePlatform = r;
      player.ledgeSide = 'right';
      break;
    }
  }
}

function spawnParticles(x,y,count,color){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*90,
      vy:-Math.random()*90-20,
      life:0.5, maxLife:0.5, color
    });
  }
}
function triggerShake(mag){ shakeTimer = SHAKE_DURATION; shakeMag = mag; }
function loseLife(){
  lives--;
  if(lives<=0){ state='gameover'; SFX.gameover(); return; }
  player.x = checkpointX; player.y = GROUND_Y-player.h-2;
  player.vx = 0; player.vy = 0; player.isLedgeHanging = false; player.isClimbing = false; player.invuln = 1.4;
  SFX.hurt(); triggerShake(4);
}

/* loop*/
function update(dt){
  elapsed += dt;
  if(state!=='playing') return;

  timeLeft = Math.max(0, timeLeft-dt);
  const solids = STATIC_SOLIDS;

  if(player.isClimbing){
    player.vx = 0;
    player.vy = 0;
    player.climbTimer += dt;
    const t = Math.min(1, player.climbTimer / player.climbDuration);

    if(t < 0.5){
      const e = smoothstep(t/0.5);
      player.x = lerp(player.climbFrom.x, player.climbMid.x, e);
      player.y = lerp(player.climbFrom.y, player.climbMid.y, e);
    } else {
      const e = smoothstep((t-0.5)/0.5);
      player.x = lerp(player.climbMid.x, player.climbTo.x, e);
      player.y = lerp(player.climbMid.y, player.climbTo.y, e);
    }

    if(t>=1){
      player.x = player.climbTo.x;
      player.y = player.climbTo.y;
      player.isClimbing = false;
      player.onGround = true;
    }
  } else if(player.isLedgeHanging){
    player.vx = 0;
    player.vy = 0;

    if(jumpQueued || input.up){
      if(player.ledgePlatform){
        const r = player.ledgePlatform;
        const finalX = player.ledgeSide === 'left' ? r.x + 2 : r.x + r.w - player.w - 2;
        const finalY = r.y - player.h;
        player.climbFrom = { x: player.x, y: player.y };
        player.climbMid = { x: player.x, y: r.y - player.h - 5 };
        player.climbTo = { x: finalX, y: finalY };
        player.climbTimer = 0;
        player.isClimbing = true;
      }
      player.isLedgeHanging = false;
      jumpQueued = false;
      SFX.jump();
    } else if(input.down){
      player.isLedgeHanging = false;
      player.vy = 80;
    }
  } else {
    const accel = MOVE_ACCEL * (player.onGround ? 1 : AIR_CONTROL);

    if(input.left && !input.right){ player.vx -= accel*dt; player.facing = -1; }
    else if(input.right && !input.left){ player.vx += accel*dt; player.facing = 1; }
    else{
      if(player.vx>0) player.vx = Math.max(0, player.vx-FRICTION*dt);
      else if(player.vx<0) player.vx = Math.min(0, player.vx+FRICTION*dt);
    }
    player.vx = clamp(player.vx,-MAX_SPEED,MAX_SPEED);

    if(player.onGround) coyoteTimer = COYOTE_TIME;
    else coyoteTimer = Math.max(0, coyoteTimer-dt);

    if(jumpQueued){
      if(coyoteTimer>0){ player.vy = -JUMP_SPEED; coyoteTimer = 0; SFX.jump(); }
      jumpQueued = false;
    }

    player.vy = Math.min(MAX_FALL, player.vy+GRAVITY*dt);

    moveAndCollide(player, dt, solids);
    checkLedgeGrab(solids);
  }

  if(player.invuln>0) player.invuln = Math.max(0, player.invuln-dt);
  if(player.onGround) checkpointX = Math.max(checkpointX, player.x-6);

  for(const en of enemies){
    if(!en.alive){ en.deathTimer -= dt; continue; }
    en.x += en.dir*en.speed*dt;
    if(en.x<en.minX){ en.x=en.minX; en.dir=1; }
    if(en.x+en.w>en.maxX){ en.x=en.maxX-en.w; en.dir=-1; }

    if(rectsOverlap(player,en)){
      if(player.vy > 0 && (player.y + player.h) <= en.y + 8){
        en.alive = false; en.deathTimer = 0.3;
        player.vy = -JUMP_SPEED*0.55;
        score += 100;
        spawnParticles(en.x+en.w/2, en.y+en.h/2, 7, '#ffffff');
        SFX.stomp();
      } else if(player.invuln<=0){
        lives--;
        if(lives<=0){ state='gameover'; SFX.gameover(); return; }
        else{
          player.invuln = 1.3;
          player.isLedgeHanging = false;
          player.isClimbing = false;
          player.vx = -player.facing*110;
          player.vy = -240;
          SFX.hurt(); triggerShake(4);
        }
      }
    }
  }
  enemies = enemies.filter(en=>en.alive || en.deathTimer>0);

  for(const c of coins){
    if(c.taken) continue;
    const coinRect = {x:c.x-5,y:c.y-5,w:10,h:10};
    if(rectsOverlap(player,coinRect)){
      c.taken = true; coinCount++; score += 10;
      spawnParticles(c.x,c.y,5,COLORS.matchaLight);
      SFX.coin();
    }
  }

  if(score>=nextLifeScore){ lives++; nextLifeScore += 2000; }
  if(player.y>GAME_H+30){ loseLife(); }

  if(state==='playing' && player.x+player.w>=FLAG_X){
    state = 'win';
    score += Math.floor(timeLeft)*10;
    SFX.win();
  }

  for(const p of particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt; p.life -= dt;
  }
  particles = particles.filter(p=>p.life>0);

  const targetCam = player.x+player.w/2-GAME_W/2;
  camX = clamp(targetCam, 0, Math.max(0, WORLD_LEN-GAME_W));

  if(shakeTimer>0) shakeTimer = Math.max(0, shakeTimer-dt);
}

/* rendir */
function drawPixelText(text,x,y,opts){
  opts = opts || {};
  const size = opts.size || 10;
  const color = opts.color || COLORS.text;
  const shadow = opts.shadow!==undefined ? opts.shadow : COLORS.textShadow;
  const align = opts.align || 'left';
  ctx.font = (opts.bold===false?'':'bold ') + size + "px 'Courier New', monospace";
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  if(shadow){ ctx.fillStyle = shadow; ctx.fillText(text, x+1, y+1); }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,GAME_H);
  g.addColorStop(0, COLORS.skyTop);
  g.addColorStop(1, COLORS.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,GAME_W,GAME_H);
}

function drawBackgroundCity(){
  ctx.save();
  ctx.translate(Math.round(-camX*0.25),0);
  ctx.fillStyle = COLORS.buildingDark;
  for(let i=0;i<15;i++){
    const bx = i*190 - 40;
    const bw = 120 + (i%3)*30;
    const bh = 140 + (i%4)*20;
    ctx.fillRect(bx, GAME_H - bh, bw, bh);
    
    ctx.fillStyle = 'rgba(255, 234, 120, 0.15)';
    for(let wx=bx+10; wx<bx+bw-10; wx+=16){
      for(let wy=GAME_H-bh+15; wy<GAME_H-20; wy+=22){
        if((wx+wy)%3 === 0) ctx.fillRect(wx, wy, 6, 10);
      }
    }
    ctx.fillStyle = COLORS.buildingDark;
  }
  ctx.restore();
}

function drawCityGround(){
  for(const r of GROUND_RECTS){
    if(r.x+r.w<camX-20 || r.x>camX+GAME_W+20) continue;
    
    ctx.fillStyle = COLORS.buildingMid;
    ctx.fillRect(r.x, r.y, r.w, Math.min(r.h, GAME_H-r.y+40));
    
    ctx.fillStyle = COLORS.roofEdge;
    ctx.fillRect(r.x, r.y, r.w, 5);
    
    for(let x=Math.ceil((r.x+8)/20)*20; x<r.x+r.w-12; x+=20){
      for(let y=r.y+18; y<GAME_H; y+=24){
        const isLit = (x*3 + y*7)%5 < 3;
        ctx.fillStyle = isLit ? COLORS.windowLit : COLORS.windowDark;
        ctx.fillRect(x, y, 10, 14);
      }
    }
  }
}

function drawPlatforms(){
  for(const p of PLATFORM_TEMPLATE){
    if(p.x+p.w<camX-20 || p.x>camX+GAME_W+20) continue;
    
    ctx.fillStyle = COLORS.buildingLight;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    
    ctx.fillStyle = COLORS.cyan;
    ctx.fillRect(p.x, p.y, p.w, 2);

    ctx.fillStyle = COLORS.buildingMid;
    for(let x=p.x+6; x<p.x+p.w-6; x+=16){
      ctx.fillRect(x, p.y+4, 8, p.h-4);
    }
  }
}

function drawFlag(){
  const poleTop = GROUND_Y-140;
  ctx.fillStyle = COLORS.pole;
  ctx.fillRect(FLAG_X, poleTop, 3, GROUND_Y-poleTop);
  ctx.fillStyle = COLORS.ball;
  ctx.beginPath(); ctx.arc(FLAG_X+1.5, poleTop-3, 4, 0, Math.PI*2); ctx.fill();
  
  const wave = Math.sin(elapsed*3)*4;
  ctx.fillStyle = COLORS.flagColor;
  ctx.beginPath();
  ctx.moveTo(FLAG_X+3, poleTop+6);
  ctx.lineTo(FLAG_X+22+wave, poleTop+13);
  ctx.lineTo(FLAG_X+3, poleTop+22);
  ctx.closePath(); ctx.fill();
}

function drawMatchaDrink(x, y){
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = COLORS.matchaOutline;
  ctx.fillRect(-6, -7, 12, 2);
  ctx.fillRect(2, -10, 2, 4);

  ctx.fillRect(-5, -5, 10, 11);
  ctx.fillRect(-4, 6, 8, 2);

  ctx.fillStyle = COLORS.matchaLight;
  ctx.fillRect(-4, -5, 8, 2);

  ctx.fillStyle = COLORS.matchaMid;
  ctx.fillRect(-4, -3, 8, 8);
  ctx.fillRect(-3, 5, 6, 2);

  ctx.fillStyle = COLORS.matchaLight;
  ctx.fillRect(-3, -3, 3, 4);

  ctx.fillStyle = COLORS.boba;
  ctx.fillRect(1, 0, 2, 2);
  ctx.fillRect(-2, 2, 2, 2);
  ctx.fillRect(1, 3, 2, 2);
  ctx.fillRect(-1, 4, 2, 2);

  ctx.restore();
}

function drawCoins(){
  for(const c of coins){
    if(c.taken) continue;
    if(c.x<camX-20 || c.x>camX+GAME_W+20) continue;
    const bobY = Math.sin(elapsed*5 + c.x)*2;
    drawMatchaDrink(c.x, c.y + bobY);
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-1.5,p.y-1.5,3,3);
  }
  ctx.globalAlpha = 1;
}

/* venom */
function drawEnemies(){
  for(const en of enemies){
    if(en.x<camX-30 || en.x>camX+GAME_W+30) continue;
    const dying = !en.alive;
    const squishY = dying ? Math.max(0.15, en.deathTimer/0.3) : 1;
    ctx.save();
    ctx.translate(en.x+en.w/2, en.y+en.h);
    
    let scaleX = en.dir > 0 ? -1 : 1;

    ctx.scale(scaleX, squishY);
    if(dying) ctx.globalAlpha = Math.max(0, en.deathTimer/0.3);

    const drawW = 20;
    const drawH = 20;
    ctx.drawImage(enemyImg, -drawW / 2, -drawH, drawW, drawH);

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* sprite */
function drawPlayerSpriteAt(x, y, facing){
  ctx.save();
  ctx.translate(x, y);

  let scaleX = facing < 0 ? -1 : 1;
  let scaleY = 1;
  let rot = 0;

  if (!player.onGround) {
    rot = facing * -0.15;
    scaleY = 1.06;
  } else if (Math.abs(player.vx) > 8) {
    const runCycle = Math.sin(elapsed * 16);
    rot = facing * runCycle * 0.08;
    scaleY = 1 + runCycle * 0.04;
  }

  ctx.scale(scaleX, scaleY);
  if (rot !== 0) ctx.rotate(rot);


  const drawW = 22;
  const drawH = 26;
  ctx.drawImage(playerImg, -drawW / 2, -drawH, drawW, drawH);

  ctx.restore();
}

function drawHangingSpriteAt(x, y, facing){
  ctx.save();
  ctx.translate(x, y);

  let scaleX = facing < 0 ? -1 : 1;
  ctx.scale(scaleX, 1);

  // gentle pendulum sway, pivoting from the gripping hand (the origin)
  const dangle = Math.sin(elapsed * 2.4) * 0.09 + Math.sin(elapsed * 1.15) * 0.03;
  ctx.rotate(dangle);

  const drawW = 28;
  const drawH = 35;
  
  const handOffsetX = -drawW * 0.68;
  const handOffsetY = -2 + Math.sin(elapsed * 2.4 + 0.6) * 0.8;

  ctx.drawImage(hangingImg, handOffsetX, handOffsetY, drawW, drawH);

  ctx.restore();
}

function drawPlayer(){
  if(player.invuln > 0 && Math.floor(elapsed * 14) % 2 === 0) return;
  if(player.isClimbing){
    const t = player.climbTimer / player.climbDuration;
    if(t < 0.55){
      drawHangingSpriteAt(player.x + player.w/2, player.y, player.facing);
    } else {
      drawPlayerSpriteAt(player.x + player.w/2, player.y + player.h, player.facing);
    }
  } else if(player.isLedgeHanging){
    drawHangingSpriteAt(player.x + player.w/2, player.y, player.facing);
  } else {
    drawPlayerSpriteAt(player.x + player.w/2, player.y + player.h, player.facing);
  }
}

function drawHUD(){
  ctx.fillStyle = 'rgba(8,8,16,0.65)';
  ctx.fillRect(0,0,GAME_W,22);
  drawPixelText('SCORE '+String(score).padStart(6,'0'), 5, 15, {size:9, align:'left'});
  
  drawMatchaDrink(148, 11);
  drawPixelText('x'+coinCount, 158, 15, {size:9, align:'left', color:COLORS.gold});
  
  drawPixelText('LIVES x'+lives, 250, 15, {size:9, align:'left'});
  drawPixelText('TIME '+Math.ceil(timeLeft), GAME_W-6, 15, {size:9, align:'right'});
}

function drawOverlay(alpha){
  ctx.fillStyle = 'rgba(5,5,12,'+alpha+')';
  ctx.fillRect(0,0,GAME_W,GAME_H);
}

function drawStartScreen(){
  drawOverlay(0.65);
  drawPixelText('SPIDERMAN YIZ', GAME_W/2, 90, {size:24, align:'center', color:COLORS.snoopyRed});
  drawPixelText('SNOOPY!!', GAME_W/2, 110, {size:9, align:'center', color:COLORS.cyan});
  if(Math.floor(elapsed*2)%2===0){
    drawPixelText('PRESS SPACE OR TAP TO START', GAME_W/2, 165, {size:10, align:'center', color:'#fff'});
  }
  drawPixelText('ARROWS/TOUCH MOVE · SPACE JUMP · UP CLIMB LEDGE', GAME_W/2, 210, {size:7, align:'center', color:'#9a9ab0'});
  drawPixelText('COLLECT MATCHA DRINKS & DEFEAT VENOM LOOKING DUDES!', GAME_W/2, 230, {size:7, align:'center', color:'#c9c9e0'});
}

function drawPauseOverlay(){
  drawOverlay(0.5);
  drawPixelText('PAUSED', GAME_W/2, 130, {size:22, align:'center'});
  drawPixelText('PRESS P TO RESUME', GAME_W/2, 155, {size:9, align:'center', color:'#c9c9e0'});
}

function drawGameOverScreen(){
  drawOverlay(0.7);
  drawPixelText('GAME OVER', GAME_W/2, 110, {size:26, align:'center', color:COLORS.danger});
  drawPixelText('SCORE '+String(score).padStart(6,'0'), GAME_W/2, 140, {size:11, align:'center'});
  if(Math.floor(elapsed*2)%2===0){
    drawPixelText('PRESS SPACE OR TAP TO RETRY', GAME_W/2, 175, {size:9, align:'center', color:'#fff'});
  }
}

function drawWinScreen(){
  drawOverlay(0.85);

  drawPixelText('YEHEY NATAPOS MOO', GAME_W/2, 45, {size:16, align:'center', color:COLORS.gold});
  drawPixelText('Will you watch the Spiderman movie with me?', GAME_W/2, 85, {size:15, align:'center', color:COLORS.cyan});

  ctx.fillStyle = winChoice === 'yes' ? COLORS.snoopyRed : 'rgba(230,36,41,0.3)';
  ctx.strokeStyle = COLORS.snoopyRed;
  ctx.lineWidth = 2;
  ctx.fillRect(150, 160, 80, 32);
  ctx.strokeRect(150, 160, 80, 32);
  drawPixelText('YES', 190, 181, {size:12, align:'center', color:'#ffffff'});

  ctx.fillStyle = winChoice === 'no' ? '#444455' : 'rgba(255,255,255,0.1)';
  ctx.strokeStyle = '#888899';
  ctx.fillRect(250, 160, 80, 32);
  ctx.strokeRect(250, 160, 80, 32);
  drawPixelText('NO', 290, 181, {size:12, align:'center', color:'#ffffff'});

  if(winChoice){
    drawPlayerSpriteAt(GAME_W/2 - 60, 145, 1);

    const bubbleX = GAME_W/2 - 35;
    const bubbleY = 110;
    const text = winChoice === 'yes' ? 'YEHEY!' : 'aw okay';
    const textColor = winChoice === 'yes' ? COLORS.snoopyRed : '#444455';

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bubbleX, bubbleY, 90, 24);
    
    ctx.beginPath();
    ctx.moveTo(bubbleX - 6, bubbleY + 12);
    ctx.lineTo(bubbleX, bubbleY + 6);
    ctx.lineTo(bubbleX, bubbleY + 18);
    ctx.fill();

    drawPixelText(text, bubbleX + 45, bubbleY + 16, {size:11, align:'center', color:textColor, shadow:false});
  }
}

function render(){
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,GAME_W,GAME_H);
  
  drawSky();
  drawBackgroundCity();

  ctx.save();
  const shk = shakeTimer>0 ? (shakeTimer/SHAKE_DURATION) : 0;
  const shakeX = shk ? (Math.random()-0.5)*shakeMag*shk : 0;
  const shakeY = shk ? (Math.random()-0.5)*shakeMag*shk*0.6 : 0;
  ctx.translate(Math.round(-camX+shakeX), Math.round(shakeY));

  drawCityGround();
  drawPlatforms();
  drawFlag();
  drawCoins();
  drawParticles();
  drawEnemies();
  drawPlayer();
  ctx.restore();

  drawHUD();

  if(state==='start') drawStartScreen();
  else if(state==='paused') drawPauseOverlay();
  else if(state==='gameover') drawGameOverScreen();
  else if(state==='win') drawWinScreen();
}

/* loopsmain */
let lastTime = 0;
function loop(ts){
  if(!lastTime) lastTime = ts;
  let dt = (ts-lastTime)/1000;
  lastTime = ts;
  dt = Math.min(dt, 0.033);
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
